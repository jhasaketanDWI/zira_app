<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f5f7; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 3px; overflow: hidden; border: 1px solid #dfe1e6; }
        .header { background-color: #0052cc; padding: 20px; color: white; }
        .content { padding: 30px; color: #172b4d; line-height: 1.5; }
        .details-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .details-table td { padding: 8px 0; border-bottom: 1px solid #ebecf0; font-size: 14px; }
        .label { color: #6b778c; width: 30%; font-weight: bold; }
        .footer { background-color: #fafbfc; padding: 15px; text-align: center; font-size: 12px; color: #6b778c; border-top: 1px solid #dfe1e6; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #0052cc; color: white; text-decoration: none; border-radius: 3px; margin-top: 20px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin:0;">{{ title }}</h2>
        </div>
        <div class="content">
            <p><strong>Hi there,</strong></p>
            <p>{{ message_body }}</p>

            {% if details %}
            <table class="details-table">
                {% for key, value in details.items %}
                <tr>
                    <td class="label">{{ key }}</td>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </table>
            {% endif %}

            {% if action_url %}
            <div style="text-align: center;">
                <a href="{{ action_url }}" class="btn">View Details</a>
            </div>
            {% endif %}
        </div>
        <div class="footer">
            Sent by Qora-AI Notification System
        </div>
    </div>
</body>
</html>
